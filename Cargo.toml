[package]
name = "theme-fixer"
description = "Fixes incomplete zed theme"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/reeves-48777/theme-fixer"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
