[workspace]
members = [
    "crates/kenaz_bin", "crates/kenaz_core", "crates/kenaz_macros",
]

resolver = "3"

[workspace.dependencies]
anyhow = "1.0.104"
palette = "0.7.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
rusqlite = { version = "0.40.2", features = ["bundled"] }
typify = "0.7.0"
tracing = "0.1.44"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "3.0.3", features = ["full", "parsing", "visit-mut"] }
tar = "0.4.46"
flate2 = "1.1.9"
ureq = { version = "3.4.0", features = ["json"] }


[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
